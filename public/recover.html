<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="cache-control" content="no-store" />
    <title>Refreshing Alamo Platform</title>
    <style>
      :root {
        color: #17201c;
        background: #f4f6f4;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;

      }

      main {

        border: 1px solid #c9d2cd;
        border-radius: 1.25rem;
        background: #fff;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #5c6761;
        line-height: 1.5;
      }
    </style>
    <script src="/recover-client.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Refreshing Alamo Platform</h1>
      <p>Loading the current dashboard release…</p>
    </main>
  </body>
</html>
