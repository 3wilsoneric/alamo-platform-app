<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>Alamo Health is offline</title>
    <style>
      :root { color: #111; background: #fff; font-family: "Avenir Next", "SF Pro Display", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100% - 48px)); }
      strong { color: #08745f; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 24px 0 12px; font-size: clamp(32px, 7vw, 54px); line-height: 1.05; }
      p { margin: 0; color: #595959; font-size: 17px; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 24px; padding: 0 20px; border: 1px solid #08745f; border-radius: 999px; color: #fff; background: #08745f; font-size: 15px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <strong>Alamo Health</strong>
      <h1>A connection is required.</h1>
      <p>Reconnect, then continue. The platform will take you back through sign-in if your session ended. No platform data is stored in the offline screen.</p>
      <a href="/home">Try again</a>
    </main>
  </body>
</html>
