<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Carelog</title>
    <style>
      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f7f2;font-family:Arial,Helvetica,sans-serif}
      #surface{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;background:#fff}
      #app-screen{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;transform-origin:top left}
      #turn{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:24px;background:#102d32;color:#fff;text-align:center}
      #turn[hidden]{display:none}
      #turn h1{margin:0 0 10px;font-size:clamp(26px,7vw,40px);line-height:1.1}
      #turn p{max-width:360px;margin:0;color:#d7e6e2;font-size:17px;line-height:1.5}
      #turn button{min-height:48px;margin-top:24px;padding:11px 20px;border:1px solid #a9d4c8;border-radius:7px;background:#f8fffc;color:#103f38;font:700 16px/1 Arial,Helvetica,sans-serif}
      #turn svg{display:block;width:76px;height:76px;margin:0 auto 24px;stroke:#9cdbc4;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      #status{position:fixed;inset:auto 20px 20px;z-index:3;color:#8c261f;text-align:center}
      #loading{position:fixed;inset:0;z-index:1;display:grid;place-items:center;background:#f8f7f2;color:#173c37;font:700 18px/1.4 Arial,Helvetica,sans-serif}
      #loading[hidden]{display:none}
      @media (orientation: portrait){html[data-phone]:not([data-continue-upright]) #turn:not([hidden]){display:grid!important}}
      @media (orientation: landscape){html[data-phone] #turn{display:none!important}}
    </style>
    <script defer src="/carelog-launch.js?v=phone-zoom-1104"></script>
  </head>
  <body>
    <div id="turn" role="status" hidden><div><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="11" y="25" width="58" height="34" rx="5"/><path d="M25 16a25 25 0 0 1 40 5m-1-10 2 12-12-1"/></svg><h1>Turn your phone sideways</h1><p>Carelog is ready. If it stays here after you turn, switch off Portrait Orientation Lock or continue upright.</p><button id="continue-upright" type="button">Continue upright</button></div></div>
    <div id="surface"><iframe id="app-screen" title="Carelog Point of Care" src="about:blank" allow="fullscreen"></iframe></div>
    <div id="loading" role="status">Opening Carelog…</div>
    <div id="status" role="alert"></div>
  </body>
</html>
