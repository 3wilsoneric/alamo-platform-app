<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      .app-boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #241f18;
        font-family: "Avenir Next", Manrope, "SF Pro Display", ui-sans-serif, system-ui, sans-serif;
      }

      .app-boot-card {
        width: min(360px, 100%);
        padding: 8px;
      }

      .app-boot-title {
        margin: 0;
        color: #0f8b73;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .app-boot-title-health {
        margin-left: 4px;
        color: #315b54;
        font-size: 23px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .app-boot-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        color: #595959;
        font-size: 13px;
      }

      .app-boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #d9d9d9;
        border-top-color: #0f8b73;
        border-radius: 999px;
        animation: app-boot-spin 0.8s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
    <title>Alamo Platform</title>
  </head>
  <body>
    <div id="root">
      <main class="app-boot-shell" aria-label="Loading Alamo Platform">
        <section class="app-boot-card">
          <h1 class="app-boot-title">Alamo <span class="app-boot-title-health">Health</span></h1>
          <div class="app-boot-status" role="status">
            <span class="app-boot-spinner" aria-hidden="true"></span>
            <span>Opening the platform</span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
